name: Deploy EchoLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/data
          # Copy all website files to root of _site
          cp code/index.html code/app.js code/style.css \
             code/timeline.js code/timeline.css code/timeline-math.js \
             code/study.js code/study.css \
             code/spectrogram-guide.js code/spectrogram-guide.css \
             code/workbench.css \
             _site/
          # Copy all data (original/ and simulated/ audio & json)
          cp -r data/. _site/data/
          # Also duplicate code/ directory so /code/ URL works if accessed directly
          mkdir -p _site/code
          cp code/index.html code/app.js code/style.css \
             code/timeline.js code/timeline.css code/timeline-math.js \
             code/study.js code/study.css \
             code/spectrogram-guide.js code/spectrogram-guide.css \
             code/workbench.css \
             _site/code/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
